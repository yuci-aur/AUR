allowBuilds:
  '@firebase/util': true
  protobufjs: true
  sharp: true
  unrs-resolver: true

overrides:
  # jwks-rsa@4.1.0 (via firebase-admin) declares jose ^6.1.3 but loads it with
  # require(). jose 6 is ESM-only, so on the serverless Node runtime that throws
  # ERR_REQUIRE_ESM and every firebase-admin route 500s. jose 5 ships a CommonJS
  # build and exports the two functions jwks-rsa uses (importJWK, exportSPKI).
  # Remove once jwks-rsa ships a release that imports jose 6 correctly.
  jose: ^5.10.0
